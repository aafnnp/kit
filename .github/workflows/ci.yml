name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  NSH_VERSION: "0.3.0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS / macos
            os: macos-14
            target: macos
            cli: ./scripts/nsh.sh
          - name: Linux / linux
            os: ubuntu-24.04
            target: linux
            cli: ./scripts/nsh.sh
          - name: Windows / windows
            os: windows-latest
            target: windows
            cli: ./scripts/nsh.ps1
          - name: Web
            os: ubuntu-24.04
            target: web
            cli: ./scripts/nsh.sh

    steps:
      - uses: actions/checkout@v4

      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-1

      - name: Cache NSH toolchain
        uses: actions/cache@v4
        with:
          path: .tools/nsh
          key: nsh-${{ runner.os }}-${{ env.NSH_VERSION }}

      - name: Type check
        run: ${{ matrix.cli }} check .

      - name: Tests
        run: ${{ matrix.cli }} test .

      - name: Package
        run: ${{ matrix.cli }} package . --target ${{ matrix.target }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: kit-${{ matrix.target }}
          path: .nsh/out/
          if-no-files-found: error
