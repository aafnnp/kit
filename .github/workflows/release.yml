name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NSH_VERSION: "0.3.0"

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            target: macos
            cli: ./scripts/nsh.sh
          - name: Linux
            os: ubuntu-24.04
            target: linux
            cli: ./scripts/nsh.sh
          - name: Windows
            os: windows-latest
            target: windows
            cli: ./scripts/nsh.ps1
          - name: Web
            os: ubuntu-24.04
            target: web
            cli: ./scripts/nsh.sh

    steps:
      - uses: actions/checkout@v4

      - name: Version check
        shell: bash
        run: ./scripts/check-version.sh

      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-1

      - name: Cache NSH toolchain
        uses: actions/cache@v4
        with:
          path: .tools/nsh
          key: nsh-${{ runner.os }}-${{ env.NSH_VERSION }}

      - name: Check and test
        run: |
          ${{ matrix.cli }} check .
          ${{ matrix.cli }} test .

      - name: Package
        run: ${{ matrix.cli }} package . --target ${{ matrix.target }}

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent .nsh/out/Kit.app kit-macos.zip

      - name: Archive (Linux)
        if: runner.os == 'Linux' && matrix.target == 'linux'
        run: |
          if ls .nsh/out/*.tar.gz >/dev/null 2>&1; then
            cp .nsh/out/*.tar.gz kit-linux.tar.gz
          else
            tar -czf kit-linux.tar.gz -C .nsh/out .
          fi

      - name: Archive (Web)
        if: matrix.target == 'web'
        run: tar -czf kit-web.tar.gz -C .nsh/out/Kit .

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path .nsh/out/* -DestinationPath kit-windows.zip

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: kit-*
          if-no-files-found: ignore

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release/* --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
