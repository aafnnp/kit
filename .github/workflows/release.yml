name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NSH_VERSION: "0.5.1"

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version check
        shell: bash
        run: ./scripts/check-version.sh

      - name: Linux runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-1

      - name: Cache NSH toolchain
        uses: actions/cache@v4
        with:
          path: .tools/nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ env.NSH_VERSION }}

      - name: Type check
        run: ./scripts/nsh.sh check .

      - name: Tests
        run: ./scripts/nsh.sh test .

  package:
    name: Package ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: linux
            arch: x86_64
            cli: ./scripts/nsh.sh
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: linux
            arch: aarch64
            cli: ./scripts/nsh.sh
          - name: windows-x86_64
            os: windows-2022
            target: windows
            arch: x86_64
            cli: ./scripts/nsh.ps1
          - name: windows-arm64
            os: windows-11-arm
            target: windows
            arch: arm64
            cli: ./scripts/nsh.ps1
          - name: macos-arm64
            os: macos-15
            target: macos
            arch: arm64
            cli: ./scripts/nsh.sh
            package_args: --arch arm64
          - name: macos-x86_64
            os: macos-15-intel
            target: macos
            arch: x86_64
            cli: ./scripts/nsh.sh
            package_args: --arch x86_64
          - name: web
            os: ubuntu-24.04
            target: web
            cli: ./scripts/nsh.sh

    steps:
      - uses: actions/checkout@v4

      # 标签构建直接用 v1.2.3 的版本号，其他触发方式追加提交号，保证每个产物可追溯。
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' nsh.json | head -n1)"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${base}+g$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "版本：${version}"

      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-1

      - name: Cache NSH toolchain
        uses: actions/cache@v4
        with:
          path: .tools/nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ env.NSH_VERSION }}

      - name: Package
        run: ${{ matrix.cli }} package . --target ${{ matrix.target }} ${{ matrix.package_args }}

      # 每个平台把自己的产物整理成 kit-<版本>-<平台>-<架构>.<扩展名>。
      - name: Stage release files (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/package-release.sh ${{ matrix.target }} "${{ steps.version.outputs.version }}" "${{ matrix.arch }}" dist

      - name: Stage release files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-release.ps1 -Target ${{ matrix.target }} -Version '${{ steps.version.outputs.version }}' -Arch ${{ matrix.arch }} -OutDir dist

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # 生成变更清单需要完整历史与标签，默认的浅克隆拿不到。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Linux runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-1

      - name: Cache NSH toolchain
        uses: actions/cache@v4
        with:
          path: .tools/nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ env.NSH_VERSION }}

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          scripts/release-notes.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notes.md"
          scripts/release-notes.sh --section "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/changes.md"
          cat "$RUNNER_TEMP/notes.md"

      # 自动更新清单只描述 nsh package 写出的平台包；dmg、deb 和 setup.exe
      # 仍作为手动安装包随发布提供。
      - name: Generate update manifest
        shell: bash
        run: |
          set -euo pipefail
          archives=(
            dist/kit-*-linux-x86_64.tar.gz
            dist/kit-*-linux-aarch64.tar.gz
            dist/kit-*-macos-x86_64.tar.gz
            dist/kit-*-macos-aarch64.tar.gz
            dist/kit-*-windows-x86_64.zip
            dist/kit-*-windows-aarch64.zip
          )
          for archive in "${archives[@]}"; do
            [[ -f "$archive" ]] || { echo "缺少自动更新包：$archive" >&2; exit 1; }
          done
          ./scripts/nsh.sh update-manifest "${archives[@]}" \
            --notes "$RUNNER_TEMP/changes.md" -o dist
          cat dist/latest.json

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$notes"
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes-file "$notes"
          fi
