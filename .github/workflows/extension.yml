name: "Extension Build"

# 扩展是独立子项目（extension/），因此单独一条工作流：
# 只在该目录发生变化时触发，不牵动桌面端 / Web 端的发布流程。
on:
  push:
    branches:
      - extension
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
    tags:
      - "ext-v*"
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build extension (${{ matrix.browser }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: extension

    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            build: build
            package: zip
          - browser: firefox
            build: build:firefox
            package: zip:firefox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run ${{ matrix.build }}

      - name: Package zip
        run: npm run ${{ matrix.package }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kit-extension-${{ matrix.browser }}
          path: extension/.output/*.zip
          if-no-files-found: error

  release:
    name: Attach packages to release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/ext-v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: extension-dist
          merge-multiple: true

      - name: Create / update release
        uses: softprops/action-gh-release@v1
        with:
          files: extension-dist/*.zip
          generate_release_notes: true
